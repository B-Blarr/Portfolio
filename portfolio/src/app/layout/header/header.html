<a class="skip-link" href="#main-content" (click)="skipToContent($event)">{{
  'nav.skipToContent' | translate
}}</a>
<header>
  <div class="button-area">
    <div class="language-switch">
      <button
        type="button"
        (click)="setActiveLanguage('en')"
        [class.active]="activeLanguage === 'en'"
        [attr.aria-pressed]="activeLanguage === 'en'"
        class="language-button"
      >
        EN
      </button>
      <button
        type="button"
        (click)="setActiveLanguage('de')"
        [class.active]="activeLanguage === 'de'"
        [attr.aria-pressed]="activeLanguage === 'de'"
        class="language-button"
      >
        DE
      </button>
    </div>
    <a class="nav-button" [routerLink]="['/']" fragment="aboutme-section">{{
      'nav.about me' | translate
    }}</a>
    <a class="nav-button" [routerLink]="['/']" fragment="skills-section">{{
      'nav.skills' | translate
    }}</a>
    <a class="nav-button" [routerLink]="['/']" fragment="projects">{{
      'nav.projects' | translate
    }}</a>
  </div>
  <a routerLink="">
    <img
      class="logo logo-full"
      src="/icons/logo.png"
      width="397"
      height="161"
      [alt]="'nav.home' | translate"
    />
    <img
      class="logo logo-small"
      src="/icons/logo-small.png"
      width="131"
      height="147"
      [alt]="'nav.home' | translate"
    />
  </a>
  <button
    #burgerButton
    type="button"
    (click)="toggleBurgerMenu()"
    (focusout)="onMenuFocusOut($event)"
    class="burger-menu"
    [class.open]="isMenuOpen"
    [attr.aria-label]="'nav.menu' | translate"
    [attr.aria-expanded]="isMenuOpen"
  ></button>
</header>
<div
  #burgerLinks
  class="burger-links-container"
  [class.flex]="isMenuOpen"
  (focusout)="onMenuFocusOut($event)"
>
  <a class="nav-button" [routerLink]="['/']" fragment="aboutme-section" (click)="closeMenu()">{{
    'nav.about me' | translate
  }}</a>
  <a class="nav-button" [routerLink]="['/']" fragment="skills-section" (click)="closeMenu()">{{
    'nav.skills' | translate
  }}</a>
  <a class="nav-button" [routerLink]="['/']" fragment="projects" (click)="closeMenu()">{{
    'nav.projects' | translate
  }}</a>
  <div class="language-switch">
    <button
      type="button"
      (click)="setActiveLanguage('en')"
      [class.active]="activeLanguage === 'en'"
      [attr.aria-pressed]="activeLanguage === 'en'"
      class="language-button"
    >
      EN
    </button>
    <button
      type="button"
      (click)="setActiveLanguage('de')"
      [class.active]="activeLanguage === 'de'"
      [attr.aria-pressed]="activeLanguage === 'de'"
      class="language-button"
    >
      DE
    </button>
  </div>
</div>
