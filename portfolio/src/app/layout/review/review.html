<section class="content">
  <h3>{{ 'references.headline' | translate }}</h3>
  <div class="carousel-wrapper">
    <article class="reference-area">
      @for (reference of reviewList; track reference.evaluatorKey; let i = $index) {
        <article
          class="reference-card"
          [class.active]="i === currentIndex"
          [class.prev]="i === getPrevIndex()"
          [class.next]="i === getNextIndex()"
          [style.transform]="getCardTransform(i)"
          [style.transition]="getCardTransition(i)"
          [style.opacity]="getCardOpacity(i)"
          [style.z-index]="getCardZIndex(i)"
          [inert]="i !== currentIndex"
        >
          <div class="quotes">
            <img src="/icons/quotes.svg" alt="" />
          </div>
          <app-reference [reference]="reference"></app-reference>
        </article>
      }
    </article>
  </div>
  <aside class="reference-area--navigation">
    <button
      type="button"
      class="arrow-button"
      (click)="previousSlide()"
      [attr.aria-label]="'references.previous' | translate"
    >
      <span class="arrow-icon arrow-left" aria-hidden="true"></span>
    </button>
    <div class="dots-container">
      @for (reference of reviewList; track reference.evaluatorKey; let i = $index) {
        <button
          type="button"
          class="dot"
          [class.active]="i === currentIndex"
          (click)="goToSlide(i)"
          [attr.aria-current]="i === currentIndex ? 'true' : null"
          [attr.aria-label]="'references.goTo' | translate: { number: i + 1 }"
        ></button>
      }
    </div>
    <button
      type="button"
      class="arrow-button"
      (click)="nextSlide()"
      [attr.aria-label]="'references.next' | translate"
    >
      <span class="arrow-icon arrow-right" aria-hidden="true"></span>
    </button>
  </aside>
</section>
