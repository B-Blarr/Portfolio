<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
<div
  class="layer"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'projects.videoButton' | translate"
  (click)="onClose($event)"
>
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div class="box" (click)="$event.stopPropagation()">
    <button
      #closeButton
      class="close-btn"
      type="button"
      [attr.aria-label]="'projects.videoClose' | translate"
      (click)="onClose($event)"
    >
      <img src="/icons/close-small.svg" alt="" />
    </button>
    <video
      #player
      controls
      autoplay
      [attr.playsinline]="playsInline ? '' : null"
      [poster]="video.poster"
      (fullscreenchange)="onFullscreenChange()"
      (webkitendfullscreen)="onNativeFullscreenEnd()"
    >
      <source [src]="video.srcSmall" type="video/mp4" media="(max-width: 700px)" />
      <source [src]="video.src" type="video/mp4" />
      @for (subtitle of video.subtitles; track subtitle.lang) {
        <track
          kind="subtitles"
          [src]="subtitle.src"
          [srclang]="subtitle.lang"
          [label]="subtitle.label"
          [attr.default]="startsVisible(subtitle) ? '' : null"
        />
      }
    </video>
    <span class="focus-wrap" tabindex="0" (focus)="closeButton.focus()"></span>
  </div>
</div>
