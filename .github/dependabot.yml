version: 2
updates:
  # npm packages are updated by hand with `ng update` and `npm update`.
  # Dependabot drops optional @emnapi entries when it regenerates
  # package-lock.json, which makes `npm ci` fail on every npm pull request.
  # Security alerts for npm still work without an entry here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
