name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Angular
    runs-on: ubuntu-latest

    # The Angular application lives in portfolio/, not in the repository
    # root. This applies to run steps only, never to the with: parameters
    # of an action - see cache-dependency-path below.
    defaults:
      run:
        working-directory: portfolio

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Full path on purpose: defaults.run.working-directory does not
          # reach into with: parameters. A bare package-lock.json here
          # would silently disable the cache, with no error to show for it.
          cache-dependency-path: portfolio/package-lock.json

      # npm ci installs the lock file verbatim and fails if it disagrees
      # with package.json. npm install would quietly resolve newer
      # versions, so the runner could build against other packages than
      # the developer does.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Runs even when the formatting check failed. Otherwise a stray
      # space would hide a real build error until the next push.
      - name: Build
        if: '!cancelled()'
        run: npm run build
