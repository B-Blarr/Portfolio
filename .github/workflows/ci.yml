name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portfolio

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Full path required: defaults.run.working-directory does not apply
          # to with: parameters. A bare package-lock.json disables the cache
          # silently, without an error.
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # !cancelled() keeps the remaining checks running after an earlier
      # failure, so one push reports every problem instead of only the first.
      - name: Check formatting
        if: '!cancelled()'
        run: npm run format:check

      - name: Build
        if: '!cancelled()'
        run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: frontend

    # Pull requests run the checks above, but never deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: portfolio

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ssh refuses a private key file that others can read, hence chmod 600.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # --delete removes the previous build's hashed bundles in the same pass,
      # so the directory is never empty in between. --chmod sets the
      # permissions while writing, which nginx needs to enter the directories.
      - name: Deploy to server
        run: |
          rsync -rltv --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/portfolio/browser/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/portfolio/"

      # A directory nginx cannot enter makes it answer with index.html and
      # status 200 instead of the file. A JSON file coming back as text/html
      # is the symptom, so a broken rollout fails here instead of looking fine.
      - name: Verify deployment
        run: |
          curl -sS -o /dev/null -w 'index.html: %{http_code}\n' https://benjaminblarr.de/
          typ=$(curl -sSI https://benjaminblarr.de/i18n/de.json | grep -i '^content-type:')
          echo "$typ"
          echo "$typ" | grep -qi 'application/json'
