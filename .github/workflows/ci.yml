name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Angular
    runs-on: ubuntu-latest

    # The Angular application lives in portfolio/, not in the repository
    # root. This applies to run steps only, never to the with: parameters
    # of an action - see cache-dependency-path below.
    defaults:
      run:
        working-directory: portfolio

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Full path on purpose: defaults.run.working-directory does not
          # reach into with: parameters. A bare package-lock.json here
          # would silently disable the cache, with no error to show for it.
          cache-dependency-path: portfolio/package-lock.json

      # npm ci installs the lock file verbatim and fails if it disagrees
      # with package.json. npm install would quietly resolve newer
      # versions, so the runner could build against other packages than
      # the developer does.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Every check runs even when an earlier one failed, so a single push
      # reports all problems at once instead of one class at a time. Only
      # an install failure stops the job, because nothing can run without
      # the dependencies.
      - name: Check formatting
        if: '!cancelled()'
        run: npm run format:check

      - name: Build
        if: '!cancelled()'
        run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    # Waits for the whole CI job. A red lint, format or build run stops the
    # deployment before it starts.
    needs: frontend

    # Only a real push to main deploys. Pull requests run CI, never this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: portfolio

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The runner is destroyed after the job, but the key still gets the
      # narrowest permissions ssh accepts: it refuses to use a key file that
      # others can read. known_hosts is filled from a fingerprint compared by
      # hand against the server, so a machine in the middle would be rejected.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # First run on purpose with --dry-run: rsync reports every file it would
      # copy and every file it would delete, and changes nothing at all.
      # Remove the flag only after that list has been read.
      - name: Deploy to server
        run: |
          rsync -rltv --delete --dry-run --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/portfolio/browser/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/portfolio/"
